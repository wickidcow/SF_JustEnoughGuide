name: Build CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    if: startsWith(github.event.head_commit.message, '[ci skip]') == false
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew clean shadowJar --no-daemon

      - name: Verify canonical addon JAR
        run: |
          test -s build/libs/SF_JustEnoughGuide2.1.55.jar
          jar tf build/libs/SF_JustEnoughGuide2.1.55.jar >/dev/null

      - name: Upload addon JAR
        uses: actions/upload-artifact@v4
        with:
          name: SF_JustEnoughGuide2.1.55
          path: build/libs/SF_JustEnoughGuide2.1.55.jar
          if-no-files-found: error
