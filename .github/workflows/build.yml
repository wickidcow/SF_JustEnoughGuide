name: Build CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    if: startsWith(github.event.head_commit.message, '[ci skip]') == false
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew clean shadowJar --no-daemon

      - name: Extract version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version = ' build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify English EMC integration labels
        shell: bash
        run: |
          set -euo pipefail
          NEW=src/main/java/com/balugaq/jeg/core/integrations/finaltechs/finalTECHCommon/FinalTECHItemPatchListener.java
          OLD=src/main/java/com/balugaq/jeg/core/integrations/finaltechs/finaltechv1/FinalTechItemPatchListener.java
          EMC=src/main/java/com/balugaq/jeg/core/integrations/emctech/EMCItemPatchListener.java

          grep -Fq 'Input EMC (New)' "$NEW"
          grep -Fq 'Output EMC (New)' "$NEW"
          grep -Fq 'Input EMC (Legacy)' "$OLD"
          grep -Fq 'Output EMC (Legacy)' "$OLD"
          grep -Fq 'Input EMC:' "$EMC"
          grep -Fq 'Output EMC:' "$EMC"

          if grep -Eq '新乱序|旧乱序|输入EMC|输出EMC' "$NEW" "$OLD" "$EMC"; then
            echo 'Chinese EMC integration lore remains in the English fork.' >&2
            exit 1
          fi

      - name: Verify maintained Legacy diagnostics
        shell: bash
        run: |
          set -euo pipefail
          HUD=src/main/java/com/balugaq/jeg/core/integrations/slimehud/HUDReachBlockGuideOption.java
          DOCTOR=src/main/java/com/balugaq/jeg/utils/LegacyDoctorMenu.java
          SETTINGS=src/main/java/com/balugaq/jeg/api/patches/JEGGuideSettings.java
          FORMATS=src/main/java/com/balugaq/jeg/utils/formatter/Formats.java
          CONFIG=src/main/resources/config.yml

          ADAPTER=src/main/java/com/balugaq/jeg/core/integrations/slimehud/JEGPlayerWAILA.java
          PLUGIN=src/main/resources/plugin.yml

          grep -Fq 'Click to set display range' "$HUD"
          grep -Fq 'setMaxDistanceOverride' "$ADAPTER"
          grep -Fq 'setVanillaEnabledOverride' "$ADAPTER"
          grep -Fq 'clearExternalOverrides' "$ADAPTER"
          grep -Fq -- '- SlimeHUD' "$PLUGIN"
          if grep -Fq 'setPaused(true)' "$ADAPTER"; then
            echo 'JEG must not pause SlimeHUD native PlayerWAILA.' >&2
            exit 1
          fi
          if grep -Fq 'extends BukkitRunnable' "$ADAPTER"; then
            echo 'JEG must not replace SlimeHUD with a second scheduled HUD loop.' >&2
            exit 1
          fi
          if grep -Fq '点击设置距离' "$HUD"; then
            echo 'Chinese SlimeHUD range lore remains in the English fork.' >&2
            exit 1
          fi

          grep -Fq 'slimefun.command.doctor' "$DOCTOR"
          grep -Fq 'slimefun.command.tick' "$DOCTOR"
          grep -Fq 'performCommand("sf tick top")' "$DOCTOR"
          grep -Fq "TICK_TOP = 'Q'" "$FORMATS"
          grep -Fq "RECOVERY_CENTER = 'U'" "$FORMATS"
          grep -Fq 'Formats.Char.RECOVERY_CENTER' "$SETTINGS"
          grep -Fq 'bQsBvBuBW' "$CONFIG"
          grep -Fq 'U = Slimefun Recovery Center (OP/admin only)' "$CONFIG"
          grep -Fq 'canAccessRecoveryCenter' "$DOCTOR"
          grep -Fq 'openDoctorTools' "$DOCTOR"
          grep -Fq 'LegacyDoctorMenu.canAccessRecoveryCenter(p)' "$SETTINGS"
          grep -Fq 'Material.TOTEM_OF_UNDYING' "$SETTINGS"
          grep -Fq 'Permission: slimefun.command.doctor' "$SETTINGS"
          grep -Fq 'Permission: slimefun.command.doctor' "$DOCTOR"

      - name: Verify canonical shaded addon JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR=build/libs/SF_JustEnoughGuide${{ steps.version.outputs.version }}.jar
          test -s "$JAR"
          jar tf "$JAR" >/dev/null
          jar tf "$JAR" | grep -Fq 'com/balugaq/jeg/libraries/libby/LibraryManager.class'
          if jar tf "$JAR" | grep -Fq 'net/byteflux/libby/LibraryManager.class'; then
            echo 'Unrelocated Libby class found in distributable JAR.' >&2
            exit 1
          fi

      - name: Upload addon JAR
        uses: actions/upload-artifact@v4
        with:
          name: SF_JustEnoughGuide${{ steps.version.outputs.version }}.jar
          path: build/libs/SF_JustEnoughGuide${{ steps.version.outputs.version }}.jar
          if-no-files-found: error
