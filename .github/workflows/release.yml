name: Auto Release on Version Change

on:
  push:
    branches:
      - master
    paths:
      - 'build.gradle.kts'
      - '.github/workflows/release.yml'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version = ' build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: tag_check
        shell: bash
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build canonical addon JAR
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          chmod +x gradlew
          ./gradlew clean shadowJar --no-daemon
          JAR="build/libs/SF_JustEnoughGuide${{ steps.version.outputs.version }}.jar"
          test -s "$JAR"
          jar tf "$JAR" >/dev/null
          jar tf "$JAR" | grep -Fq 'com/balugaq/jeg/libraries/libby/LibraryManager.class'
          if jar tf "$JAR" | grep -Fq 'net/byteflux/libby/LibraryManager.class'; then
            echo 'Unrelocated Libby class found in distributable JAR.' >&2
            exit 1
          fi

      - name: Upload Actions artifact
        if: steps.tag_check.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: SF_JustEnoughGuide${{ steps.version.outputs.version }}.jar
          path: build/libs/SF_JustEnoughGuide${{ steps.version.outputs.version }}.jar
          if-no-files-found: error

      - name: Create Release
        if: steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: JustEnoughGuide ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: build/libs/SF_JustEnoughGuide${{ steps.version.outputs.version }}.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
