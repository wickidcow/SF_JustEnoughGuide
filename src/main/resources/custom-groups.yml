enabled: true

groups:
  group1:
    enabled: false
    tier: 1
    id: custom-group # [a-z0-9/._-]
    mode: transfer # transfer / merge / actions
    display:
      # material / skull(hash/base64/url)
      material: glass
      name: "&aCustom Group"
    items:
      - COPPER_INGOT
    # Item-group format:
    # B background, b back, R real-time search, C bookmarks,
    # c bookmark item, S search, i item, P previous, N next.
    formats:
      - "BbBBBBRSB"
      - "iiiiiiiii"
      - "iiiiiiiii"
      - "iiiiiiiii"
      - "iiiiiiiii"
      - "BPBcCBBNB"

  group2:
    enabled: false
    tier: 2
    id: custom-group2
    mode: merge
    display:
      material: grass_block
      name: "&aCustom Group 2"
    groups:
      - slimefun:misc
    items:
      - ZINC_INGOT
    formats:
      - "BbBBBBRSB"
      - "iiiiiiiii"
      - "iiiiiiiii"
      - "iiiiiiiii"
      - "iiiiiiiii"
      - "BPBcCBBNB"

  group3:
    enabled: false
    tier: 3
    id: custom-group3
    mode: actions
    actions:
      # %player% = player name
      - "command /say Server action" # run as console
      - "commandp /say Player action" # run as player
      - "link https://github.com/wickidcow/SF_JustEnoughGuide"
      - "sayp Hello"
      - "lookupitem TIN_CAN"
      - "lookupgroup slimefun:misc"
