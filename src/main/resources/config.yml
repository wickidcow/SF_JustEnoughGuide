# SF_JustEnoughGuide
# English-first JustEnoughGuide fork maintained for Slimefun Legacy.
#
# Upstream automatic updating is disabled by default so this maintained fork
# cannot replace itself with an upstream artifact.
auto-update: false

guide:
  survival-guide-title: "&2&lSlimefun Guide &8- &aEnhanced"
  cheat-guide-title: "&c&lSlimefun Guide &8- &4Cheat Mode"
  settings-guide-title: "Guide Settings & Details"
  credits-guide-title: "Slimefun Contributors"
  recipe-complete: true

improvements:
  # Pinyin search is retained for compatibility but is disabled in the English-first fork.
  pinyin-search: false
  bookmark: true
  rts-search: true
  beginner-option: true
  emc-display-option: true
  finaltech-emc-display-option: true
  finalTECH-emc-display-option: true
  item-shareable: true
  cer-patch: false
  allow-action-redirect: true
  logitech-machine-stackable-display: true
  slimefun-id-display: true

# Prevent bundle interactions inside Slimefun containers when they could conflict
# with container handling.
disable-bundle-interaction: true

# Allow compatible replacement cards from different addons to interoperate.
adapt-replacement-cards: true

# Item IDs/addons excluded from replacement-card companion-item creation.
no-replacement-card-companion-item-ids: []
no-replacement-card-companion-addons: []

# Automatically expose recipe-completion buttons on supported machines.
auto-add-recipe-complete-button: true
no-auto-add-recipe-complete-blocks: []
no-auto-add-recipe-complete-addons: []

# Search filters. Leave empty for normal English-name searching.
blacklist: []
banlist: []
shared-chars: []

custom-format:
  # Main guide: B background, b back, T settings, R real-time search,
  # C bookmarks, S search, G item group, P previous, N next.
  main:
    - "BTBBBBRSB"
    - "GGGGGGGGG"
    - "GGGGGGGGG"
    - "GGGGGGGGG"
    - "GGGGGGGGG"
