# SF_JustEnoughGuide
# Maintained English-facing JustEnoughGuide fork for Slimefun Legacy.
#
# Upstream JEG features are retained while Slimefun Legacy-specific integrations
# are added without bypassing Slimefun's safety and permission checks.

guide:
  survival-guide-title: "&2&lSlimefun Legacy Guide"
  cheat-guide-title: "&c&lSlimefun Legacy Guide &4(Cheat Mode)"
  # Keep built-in Slimefun categories first, then addon categories alphabetically.
  core-first-addon-alphabetical: true

improvements:
  # Pinyin search is disabled by default in the English-facing Legacy build.
  # Server owners who intentionally use Chinese item names may enable it.
  pinyin-search: false
  bookmark: true
  rts-search: true
  beginner-option: true
  emc-display-option: true
  finaltech-emc-display-option: true
  finalTECH-emc-display-option: true
  item-shareable: true
  cer-patch: false
  allow-action-redirect: true
  logitech-machine-stackable-display: true
  slimefun-id-display: true

# Prevent bundle interaction inside Slimefun container menus.
disable-bundle-interaction: true

# Allow compatible replacement cards from different addons to interoperate.
adapt-replacement-cards: true

# Item IDs that must not create companion items through replacement-card handling.
no-replacement-card-companion-item-ids: []

# Addons that must not create companion items through replacement-card handling.
no-replacement-card-companion-addons: []

# Automatically add the recipe-completion button to compatible machines.
auto-add-recipe-complete-button: true

# Slimefun block IDs excluded from automatic recipe-completion buttons.
no-auto-add-recipe-complete-blocks: []

# Slimefun addons excluded from automatic recipe-completion buttons.
no-auto-add-recipe-complete-addons: []

# Names containing any of these terms are excluded from unrestricted searches.
blacklist: []

# Names containing any of these terms are excluded from every search mode.
banlist: []

# Optional equivalent-character search groups.
# Kept empty by default for the English-facing Legacy build.
shared-chars: []

# Register the recipe-completion guide item.
recipe-complete: true

custom-format:
  # Main guide.
  # B = background, b = back, T = settings, D = Slimefun Legacy Doctor
  # R = real-time search, C = bookmarks, S = search, G = item group
  # P = previous page, N = next page
  main:
    - "BTBBDBRSB"
    - "GGGGGGGGG"
    - "GGGGGGGGG"
    - "GGGGGGGGG"
    - "GGGGGGGGG"
    - "BPBBCBBNB"

  # Parent/nested group.
  nested-group:
    - "BbBBBBRSB"
    - "GGGGGGGGG"
    - "GGGGGGGGG"
    - "GGGGGGGGG"
    - "GGGGGGGGG"
    - "BPBBCBBNB"

  # Item group.
  # c = bookmark current item group entry, i = item.
  sub-group:
    - "BbBBBBRSB"
    - "iiiiiiiii"
    - "iiiiiiiii"
    - "iiiiiiiii"
    - "iiiiiiiii"
    - "BPBcCBBNB"

  # Slimefun recipe display.
  # r = ingredient, w = wiki, t = recipe type, i = output
  # E = large recipe, K = SlimeFunRecipe editor integration, M = Legacy machine recipes, m = value/EMC.
  recipe:
    - "bK Mrrr w"
    - " t rrr i "
    - "m  rrr ME"

  # Vanilla recipe display.
  recipe-vanilla:
    - "b  rrr  w"
    - " t rrr i "
    - "   rrr   "
    - "BPBBBBBNB"

  # RecipeDisplayItem layout.
  # d = additional displayed recipe entries.
  recipe-display:
    - "bK Mrrr w"
    - " t rrr i "
    - "m  rrr  E"
    - "BPBBBBBNB"
    - "ddddddddd"
    - "ddddddddd"

  # JEG help/features screen.
  # A = author information, h = feature entry.
  helper:
    - "BbBBBBRSB"
    - "B   A   B"
    - "BhhhhhhhB"
    - "BhhhhhhhB"
    - "BhhhhhhhB"
    - "BPBBCBBNB"

  # Settings screen.
  # s = contributors, v = version, u = source, W = wiki
  # o = guide option, l = addons, z = unofficial-build notice
  # U = Slimefun Recovery Center (OP/admin only), Q = Slimefun Tick Top
  # D = optional Doctor/Recovery shortcut for custom layouts; omitted here to avoid a duplicate button
  settings:
    - "bQsBvBuBW"
    - "BBBBBBBBB"
    - "BoooooooB"
    - "BoooooooB"
    - "BBBBBBBBB"
    - "BPlBzBUNB"

  contributors:
    - "BbBBBBBBB"
    - "ppppppppp"
    - "ppppppppp"
    - "ppppppppp"
    - "ppppppppp"
    - "BPBBBBBNB"

  # Keybind collection.
  keybinds:
    - "BbBBBBBBB"
    - "BiiiiiiiB"
    - "BiiiiiiiB"
    - "BiiiiiiiB"
    - "BiiiiiiiB"
    - "BPBBBBBNB"

  # Keybind mapping.
  # x = original action, y = separator, z = mapped action.
  keybind:
    - "BbBBBBBBB"
    - "BxyzBxyzB"
    - "BxyzBxyzB"
    - "BxyzBxyzB"
    - "BxyzBxyzB"
    - "BPBBBBBNB"

  # Key/action selection.
  action-select:
    - "BbBBBBBBB"
    - "iiiiiiiii"
    - "iiiiiiiii"
    - "BPBBBBBNB"

# Upstream JEG can translate addon names for Chinese installations.
# The maintained Legacy build keeps canonical addon names by default so all
# player-facing addon labels remain English/canonical.
local-translate: {}

# Do not change unless troubleshooting.
debug: false

data:
  # Internal configuration schema marker.
  config-version: 20260919

click-print-warning: true
